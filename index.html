<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Library</title>
<style>
:root{color-scheme:light dark;--bg:#f6f7f9;--fg:#14161a;--mu:#667085;--pn:#fff;--bd:#e4e7ec;--ac:#4f46e5;--on:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--fg:#f2f4f7;--mu:#98a2b3;--pn:#171a21;--bd:#262b36;--ac:#818cf8;--on:#0f1115}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:960px;margin:0 auto;padding:48px 20px 72px}
h1{font-size:clamp(28px,5vw,40px);letter-spacing:-.025em;line-height:1.1;margin:0 0 8px}
.intro{color:var(--mu);margin:0;max-width:52ch}
.bar{display:flex;flex-wrap:wrap;gap:12px;margin:32px 0 20px}
input{flex:1;min-width:220px;font:inherit;color:var(--fg);background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:11px 14px}
.tags{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.tags button{font:inherit;font-size:14px;color:var(--mu);background:transparent;border:1px solid var(--bd);border-radius:999px;padding:5px 14px;cursor:pointer}
.tags button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.last{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;background:var(--pn);border:1px solid var(--bd);border-radius:14px;padding:12px 16px;margin-bottom:20px}
.last[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:18px}
.card{display:flex;gap:16px;background:var(--pn);border:1px solid var(--bd);border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.06);padding:16px;transition:box-shadow .15s}
.card:hover{box-shadow:0 8px 24px rgba(16,24,40,.12)}
.ic{flex:none;width:72px;height:72px;border-radius:16px;display:grid;place-items:center;font-size:34px}
.card h2{font-size:18px;margin:0 0 2px}
.card p{margin:0 0 6px;font-size:14px;color:var(--mu)}
.card small{color:var(--mu)}
.play{display:inline-block;margin-top:10px;background:var(--ac);color:var(--on);font-weight:600;text-decoration:none;padding:8px 20px;border-radius:999px}
.play:hover{filter:brightness(1.1)}
.soon{border:1px dashed var(--bd);border-radius:16px;padding:18px;color:var(--mu);display:flex;flex-direction:column;justify-content:center}
.soon b{color:var(--fg)}
.empty{color:var(--mu)}
footer{margin-top:36px;color:var(--mu);font-size:14px}
</style></head><body>
<div class="wrap">
<h1 id="title">Game Library</h1>
<p class="intro" id="tagline"></p>
<div class="bar">
<input id="q" type="search" placeholder="Search games" aria-label="Search games">
<div class="tags" id="tags"></div>
</div>
<div class="last" id="last" hidden><span id="lasttxt"></span><a class="play" id="lastlink" style="margin:0" href="#">Play again</a></div>
<div class="grid" id="grid"></div>
<footer id="count"></footer>
</div>
<script>
/* =====================================================================
   ADD A NEW GAME: copy one { ... } block below, paste it at the top of the
   list (newest first), and change the values.
     id     a short name with no spaces (used to remember what was played last)
     path   the folder inside games/ that holds the game's index.html (end with /)
     icon   one emoji shown on the card
     colors [from, to] for the card icon's gradient
   ===================================================================== */
const SITE = {
  title: 'Game Library',
  tagline: 'Browser games you can play right now. No installs, no accounts.'
};
const GAMES = [
  {
    id: 'dragons-hoard',
    title: 'Dragon\u2019s Hoard',
    desc: 'An idle clicker with active minigames. Grow a hoard, hire minions, and defend your gold from thieves.',
    tags: ['Incremental', 'Idle', 'Minigames'],
    path: 'games/dragons-hoard/',
    icon: '\ud83d\udc09',
    colors: ['#f59e0b', '#ea580c']
  },
  {
    id: 'seven-floors-down',
    title: 'Seven Floors Down',
    desc: 'A turn-based pixel dungeon crawler. Pick a class, descend seven floors, and slay the Dungeon Lord.',
    tags: ['Roguelike', 'Turn-based', 'Pixel art'],
    path: 'games/seven-floors-down/',
    icon: '\u2694\ufe0f',
    colors: ['#6d28d9', '#be123c']
  }
];
/* ===================================================================== */

const $ = s => document.querySelector(s);
let tag = 'All', query = '';
document.title = SITE.title;
$('#title').textContent = SITE.title;
$('#tagline').textContent = SITE.tagline;

function el(t, props, ...kids) {
  const e = document.createElement(t);
  Object.assign(e, props || {});
  kids.forEach(k => e.append(k));
  return e;
}
function remember(id) { try { localStorage.setItem('lib_last', id); } catch (e) {} }
function card(g) {
  const play = el('a', { className: 'play', href: g.path, textContent: 'Play' });
  play.addEventListener('click', () => remember(g.id));
  const ic = el('div', { className: 'ic', textContent: g.icon || '\ud83c\udfae' });
  ic.style.background = 'linear-gradient(135deg,' + g.colors[0] + ',' + g.colors[1] + ')';
  ic.setAttribute('aria-hidden', 'true');
  return el('div', { className: 'card' }, ic,
    el('div', {}, el('h2', { textContent: g.title }), el('p', { textContent: g.desc }),
      el('small', { textContent: g.tags.join(', ') }), el('br'), play));
}
function render() {
  const all = ['All', ...new Set(GAMES.flatMap(g => g.tags))];
  $('#tags').replaceChildren(...all.map(t => {
    const b = el('button', { textContent: t, type: 'button' });
    b.setAttribute('aria-pressed', t === tag);
    b.addEventListener('click', () => { tag = t; render(); });
    return b;
  }));
  const q = query.trim().toLowerCase();
  const list = GAMES.filter(g => (tag === 'All' || g.tags.includes(tag)) &&
    (!q || (g.title + ' ' + g.desc + ' ' + g.tags.join(' ')).toLowerCase().includes(q)));
  const grid = $('#grid');
  grid.replaceChildren(...list.map(card));
  if (!list.length) grid.append(el('p', { className: 'empty', textContent: 'No games match that search. Clear it to see every game.' }));
  else if (tag === 'All' && !q) grid.append(el('div', { className: 'soon' }, el('b', { textContent: 'More games on the way' }), 'New games show up here as soon as they are finished.'));
  $('#count').textContent = GAMES.length + (GAMES.length === 1 ? ' game' : ' games') + ' in the library';
}
$('#q').addEventListener('input', e => { query = e.target.value; render(); });

let last = null;
try { last = GAMES.find(g => g.id === localStorage.getItem('lib_last')); } catch (e) {}
if (last) {
  $('#last').hidden = false;
  $('#lasttxt').textContent = 'You last played ' + last.title + '.';
  $('#lastlink').href = last.path;
}
render();
</script>
</body></html>
