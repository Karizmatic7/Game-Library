<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game Library</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#ece8f6;--fg:#1d1a30;--mu:#5d5878;--pn:#fff;--ed:#b9b1d6;--ac:#f2b705;--on:#1d1a30}
@media (prefers-color-scheme:dark){:root{--bg:#16142a;--fg:#ece8ff;--mu:#a49fc4;--pn:#232042;--ed:#3f3a68;--ac:#ffcc33;--on:#1d1a30}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:940px;margin:0 auto;padding:36px 16px 64px}
h1{font:700 clamp(30px,7vw,54px)/1.05 Silkscreen,"Courier New",monospace;margin:0 0 12px}
.intro{max-width:52ch;color:var(--mu);margin:0}
.bar{display:flex;flex-wrap:wrap;gap:10px;margin:28px 0 20px}
input{flex:1;min-width:200px;font:inherit;color:var(--fg);background:var(--pn);border:2px solid var(--ed);border-radius:4px;padding:10px 12px}
.tags{display:flex;flex-wrap:wrap;gap:8px;width:100%}
.tags button{font:inherit;font-size:14px;color:var(--fg);background:transparent;border:2px solid var(--ed);border-radius:4px;padding:4px 12px;cursor:pointer}
.tags button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.last{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;background:var(--pn);border:2px solid var(--ed);border-radius:4px;padding:10px 14px;margin-bottom:22px}
.last[hidden]{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,400px),1fr));gap:22px}
.card{display:flex;gap:14px;background:var(--pn);border:2px solid var(--ed);border-radius:4px;box-shadow:5px 5px 0 var(--ed);padding:12px}
.card canvas{flex:none;width:96px;height:96px;image-rendering:pixelated;border-radius:2px}
.card h2{font-size:19px;margin:0 0 2px}
.card p{margin:0 0 6px;font-size:14px;color:var(--mu)}
.card small{color:var(--mu)}
.play{display:inline-block;margin-top:8px;background:var(--ac);color:var(--on);font-weight:700;text-decoration:none;padding:8px 20px;border-radius:4px;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
.play:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 rgba(0,0,0,.4)}
.soon{border:2px dashed var(--ed);border-radius:4px;padding:16px;color:var(--mu);display:flex;flex-direction:column;justify-content:center}
.soon b{color:var(--fg)}
.empty{color:var(--mu)}
footer{margin-top:36px;color:var(--mu);font-size:14px}
</style></head><body>
<div class="wrap">
<h1 id="title">Game Library</h1>
<p class="intro" id="tagline"></p>
<div class="bar">
<input id="q" type="search" placeholder="Search games" aria-label="Search games">
<div class="tags" id="tags"></div>
</div>
<div class="last" id="last" hidden><span id="lasttxt"></span><a class="play" id="lastlink" style="margin:0" href="#">Play again</a></div>
<div class="grid" id="grid"></div>
<footer id="count"></footer>
</div>
<script>
/* =====================================================================
   ADD A NEW GAME: copy one { ... } block below, paste it at the top of the
   list (newest first), and change the values.
     id     a short name with no spaces (used to remember what was played last)
     path   the folder inside games/ that holds the game's index.html (end with /)
     colors [background, sprite] for the generated thumbnail
   ===================================================================== */
const SITE = {
  title: 'Game Library',
  tagline: 'Browser games you can play right now. No installs, no accounts.'
};
const GAMES = [
  {
    id: 'dragons-hoard',
    title: 'Dragon’s Hoard',
    desc: 'An idle clicker. Pounce on your hoard, hire minions to earn gold while you are away, and slumber to grow stronger.',
    tags: ['Incremental', 'Idle', 'Pixel art'],
    path: 'games/dragons-hoard/',
    colors: ['#6b1d1d', '#ffcc33']
  },
  {
    id: 'seven-floors-down',
    title: 'Seven Floors Down',
    desc: 'A turn-based pixel dungeon crawler. Pick a class, descend seven floors, and slay the Dungeon Lord.',
    tags: ['Roguelike', 'Turn-based', 'Pixel art'],
    path: 'games/seven-floors-down/',
    colors: ['#3b1d5c', '#ffcc33']
  }
];
/* ===================================================================== */

const $ = s => document.querySelector(s);
let tag = 'All', query = '';
document.title = SITE.title;
$('#title').textContent = SITE.title;
$('#tagline').textContent = SITE.tagline;

function el(t, props, ...kids) {
  const e = document.createElement(t);
  Object.assign(e, props || {});
  kids.forEach(k => e.append(k));
  return e;
}
/* Each game gets its own pixel sprite, generated from its id, so new games get a thumbnail automatically. */
function thumb(g) {
  const cv = el('canvas', { width: 8, height: 8 }), x = cv.getContext('2d');
  let s = 0;
  for (const ch of g.id) s = (s * 31 + ch.charCodeAt(0)) >>> 0;
  const rnd = () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296;
  x.fillStyle = g.colors[0]; x.fillRect(0, 0, 8, 8);
  x.fillStyle = g.colors[1];
  for (let y = 0; y < 8; y++) for (let i = 0; i < 4; i++) if (rnd() > .45) { x.fillRect(i, y, 1, 1); x.fillRect(7 - i, y, 1, 1); }
  cv.setAttribute('aria-hidden', 'true');
  return cv;
}
function remember(id) { try { localStorage.setItem('lib_last', id); } catch (e) {} }
function card(g) {
  const play = el('a', { className: 'play', href: g.path, textContent: 'Play' });
  play.addEventListener('click', () => remember(g.id));
  return el('div', { className: 'card' }, thumb(g),
    el('div', {}, el('h2', { textContent: g.title }), el('p', { textContent: g.desc }),
      el('small', { textContent: g.tags.join(', ') }), el('br'), play));
}
function render() {
  const all = ['All', ...new Set(GAMES.flatMap(g => g.tags))];
  $('#tags').replaceChildren(...all.map(t => {
    const b = el('button', { textContent: t, type: 'button' });
    b.setAttribute('aria-pressed', t === tag);
    b.addEventListener('click', () => { tag = t; render(); });
    return b;
  }));
  const q = query.trim().toLowerCase();
  const list = GAMES.filter(g => (tag === 'All' || g.tags.includes(tag)) &&
    (!q || (g.title + ' ' + g.desc + ' ' + g.tags.join(' ')).toLowerCase().includes(q)));
  const grid = $('#grid');
  grid.replaceChildren(...list.map(card));
  if (!list.length) grid.append(el('p', { className: 'empty', textContent: 'No games match that search. Clear it to see every game.' }));
  else if (tag === 'All' && !q) grid.append(el('div', { className: 'soon' }, el('b', { textContent: 'More games on the way' }), 'New games show up here as soon as they are finished.'));
  $('#count').textContent = GAMES.length + (GAMES.length === 1 ? ' game' : ' games') + ' in the library';
}
$('#q').addEventListener('input', e => { query = e.target.value; render(); });

let last = null;
try { last = GAMES.find(g => g.id === localStorage.getItem('lib_last')); } catch (e) {}
if (last) {
  $('#last').hidden = false;
  $('#lasttxt').textContent = 'You last played ' + last.title + '.';
  $('#lastlink').href = last.path;
}
render();
</script>
</body></html>
