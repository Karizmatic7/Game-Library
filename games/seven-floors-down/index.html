<script>
const W=50,H=30,VW=17,VH=11,T=32,MAXD=7,R=8,D=[[0,-1],[0,1],[-1,0],[1,0]];
const $=id=>document.getElementById(id),rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1)),pk=a=>a[rnd(0,a.length-1)];

let AC,muted=false,daily=0,diff=1;const DMS=[{n:'Easy',h:.75,a:.8,s:-.25},{n:'Normal',h:1,a:1,s:0},{n:'Hard',h:1.25,a:1.2,s:.25}];const dayN=Math.floor(Date.now()/864e5);
const THM=[['#524c70','#4a4468','#38335a'],['#5b5446','#50493c','#3f382b'],['#5e4545','#533b3b','#452c2c']],TC=k=>THM[Math.min(2,(depth-1)/2|0)][k];
function snd(f,d,t,v){if(muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime;o.type=t||'square';o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(Math.max(30,f*.5),n+d);g.gain.setValueAtTime(v||.04,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(n+d)}catch(e){}}
const cv=$('c'),X=cv.getContext('2d');cv.width=VW*T;cv.height=VH*T;
/* ---------- pixel sprites (8x8, scaled x4) ---------- */
const S={};
function add(n,rows,pal){const c=document.createElement('canvas');c.width=c.height=T;const g=c.getContext('2d'),P={w:'#fff',k:'#111',s:'#f0c8a0',...pal};
rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(P[ch]&&ch!='.'){g.fillStyle=P[ch];g.fillRect(x*4,y*4,4,4)}}));S[n]=c}
const HUM=["..aaaa..",".assssa.",".sk..ks.",".ssssss.","..bbbb..",".bbbbbb.",".b.bb.b.","..b..b.."];
add('Warrior',HUM,{a:'#9aa3b5',b:'#c44a4a'});add('Mage',HUM,{a:'#4a52d8',b:'#7a6df0'});add('Rogue',HUM,{a:'#2b2b33',b:'#3f9a4f'});add('Cleric',HUM,{a:'#e8e0c0',b:'#e8e8f0'});
add('gob',["a......a","aa.aa.aa",".aaaaaa.",".akaaka.",".aaaaaa.","..awwa..",".aaaaaa.",".a....a."],{a:'#4fb04f'});
add('orc',["..bbbb..",".aaaaaa.","aakaakaa","aaaaaaaa","awaaaawa",".aaaaaa.","aabbbbaa","a......a"],{a:'#b58a3c',b:'#5a3a1a'});
add('arc',["..aaaa..",".aaaaaa.",".askksa.",".aaaaaa.","b.aaaa.b","b.aaaa.b","b.a..a.b","..a..a.."],{a:'#2fa6b5',b:'#8b5a2b'});
add('spe',["..aaaa..",".aaaaaa.","aakaakaa","aaaaaaaa","aaaaaaaa","aaaaaaaa","a.aa.aa.",".a.aa.a."],{a:'#c08ae8'});
add('ogr',["..bbbb..",".bbbbbb.","bbkbbkbb","bbbwwbbb","bbbbbbbb","bbbbbbbb",".bb..bb.",".bb..bb."],{b:'#c0392b'});
add('bos',["w..aa..w","waaaaaaw","aakaakaa","aaaaaaaa","awawwawa",".aaaaaa.","aa.aa.aa","a......a"],{a:'#7a1fa2'});
const POT=["...bb...","...bb...","..aaaa..",".aaaaaa.",".aaaaaa.",".aaaaaa.","..aaaa..","........"];
add('ph',POT,{a:'#e33',b:'#ccc'});add('pm',POT,{a:'#38f',b:'#ccc'});add('pe',POT,{a:'#fb2',b:'#ccc'});add('pc',POT,{a:'#3dd',b:'#ccc'});
add('gold',["........","..aaaa..",".abbbba.",".abbbba.",".abbbba.","..aaaa..","........","........"],{a:'#fc3',b:'#e9a817'});
add('gear',["........",".aaaaaa.","abbbbbba","aaaccaaa","abbbbbba","abbbbbba","aaaaaaaa","........"],{a:'#8a5a2b',b:'#b9803c',c:'#fc3'});
add('stairs',["........","aaaaaaaa","aaaaaaaa","bbbbbbbb","..aaaaaa","..bbbbbb","....aaaa","....bbbb"],{a:'#d9d2ff',b:'#7a70c9'});
add('trap',["........","...a....","..a.a.a.",".a.a.a.a","aaaaaaaa","bbbbbbbb","........","........"],{a:'#ddd',b:'#e44'});
add('shop',["..aaaa..",".assssa.",".sk..ks.",".ssssss.","bbbbbbbb","bcbbbbcb","bbbbbbbb",".b....b."],{a:'#c9a227',b:'#7a4a9a',c:'#fc3'});
add('bat',["........","a......a","aa.aa.aa","aaaaaaaa",".akaaka.","..awwa..","........","........"],{a:'#7a6a8c'});
add('nec',["..bbbb..",".bbbbbb.",".bkbbkb.",".bbbbbb.","aaaaaaaa","aacaacaa","aaaaaaaa",".a.aa.a."],{a:'#3a2a5a',b:'#cfd8c0',c:'#7f6'});
/* ---------- data ---------- */
const CL={Warrior:{hp:100,mp:10,a:12,d:6,g:[14,2,2,1],cr:.1,mh:1,t:'Tough. Free sword hits restore MP. Shield Slam stuns, Whirlwind hits all adjacent.'},
Mage:{hp:60,mp:40,a:6,d:2,g:[9,8,2,1],cr:.1,mh:2,t:'Fragile but explosive. Free ranged Arcane Bolt. Fireball splashes, Frost Nova freezes crowds.'},
Rogue:{hp:75,mp:20,a:9,d:3,g:[14,5,3,1],cr:.25,mh:1,t:'Crits often. Free dagger hits. Shadowstrike, then Poison Blade.'},
Cleric:{hp:85,mp:25,a:8,d:4,g:[12,5,2,1],cr:.1,mh:1,t:'Holy support. Free mace hits. Smite sets foes ablaze; learn Mend at level 3 to heal yourself.'}};
const EN=[{n:'Goblin',hp:20,a:5,d:1,xp:15,s:'gob',ai:'fast',md:1,w:10,pk:[1,2]},{n:'Orc',hp:45,a:10,d:3,xp:30,s:'orc',ai:'mel',md:2,w:8,pk:[1,1]},
{n:'Archer',hp:28,a:9,d:1,xp:35,s:'arc',ai:'rng',md:2,w:6,pk:[1,1]},{n:'Specter',hp:32,a:11,d:0,xp:45,s:'spe',ai:'pha',md:3,w:5,pk:[1,1],rs:'poi'},
{n:'Ogre',hp:80,a:16,d:4,xp:70,s:'ogr',ai:'slo',md:4,w:5,pk:[1,1],rs:'fire'},
{n:'Bat',hp:14,a:5,d:0,xp:20,s:'bat',ai:'bat',md:2,w:7,pk:[1,2]},{n:'Necromancer',hp:40,a:10,d:2,xp:80,s:'nec',ai:'sum',md:5,w:4,pk:[1,1]}];
const BOSS={n:'Dungeon Lord',hp:200,a:19,d:6,xp:500,s:'bos',ai:'bos',boss:1};
let traps=new Map(),inSk=0,shk=0,map,es,items,st,vis,exp,p,depth,gold,kills,turns,won,over,inv,wpn,arm,logs,txts=[];
const ta=()=>p.a+p.ga,td=()=>p.d+p.gd;
const say=(t,c)=>{logs.push([t,c||'']);if(logs.length>5)logs.shift()};
const pop=(x,y,t,c)=>txts.push({x,y,t,c,l:0});
/* ---------- geometry ---------- */
function los(x0,y0,x1,y1){let dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1,e=dx-dy,x=x0,y=y0;
while(x!=x1||y!=y1){if((x!=x0||y!=y0)&&map[ix(x,y)])return false;const e2=2*e;if(e2>-dy){e-=dy;x+=sx}if(e2<dx){e+=dx;y+=sy}}return true}
function fov(){vis=new Set();for(let y=Math.max(0,p.y-R);y<=Math.min(H-1,p.y+R);y++)for(let x=Math.max(0,p.x-R);x<=Math.min(W-1,p.x+R);x++)
if((x-p.x)**2+(y-p.y)**2<=R*R+1&&los(p.x,p.y,x,y)){vis.add(ix(x,y));exp.add(ix(x,y))}
if(p.cls=='Rogue')traps.forEach((v,k)=>{if(!v&&Math.abs(k%W-p.x)+Math.abs((k/W|0)-p.y)<=2)traps.set(k,1)})}
function bfs(){const d=new Map([[ix(p.x,p.y),0]]),q=[[p.x,p.y]];for(let i=0;i<q.length;i++){const[x,y]=q[i],v=d.get(ix(x,y));
for(const[dx,dy]of D){const nx=x+dx,ny=y+dy,n=ix(nx,ny);if(nx>=0&&ny>=0&&nx<W&&ny<H&&!map[n]&&!d.has(n)){d.set(n,v+1);q.push([nx,ny])}}}return d}
const occ=(x,y)=>(p.x==x&&p.y==y)||es.some(e=>e.x==x&&e.y==y);
/* ---------- level generation ---------- */
function mk(t,x,y){const b=t.boss?0:depth,h=Math.round((t.hp+b*3)*DMS[diff].h);return{n:t.n,x,y,dx:x,dy:y,hp:h,mh:h,a:Math.round((t.a+b)*DMS[diff].a),d:t.d,xp:t.xp,s:t.s,ai:t.ai,boss:t.boss,st:0,poi:0,aw:t.boss?1:0,tk:0,ch:0,ct:3,fl:0,bn:0,rs:t.rs}}
function mkItem(){const k=pk(['h','h','h','m','m','g','g','g','w','a','x','y']);
if(k=='h')return{t:'h',s:'ph',n:'Healing Potion'};if(k=='m')return{t:'m',s:'pm',n:'Mana Potion'};
if(k=='g')return{t:'g',s:'gold',v:rnd(5,15)+depth*5};if(k=='x')return{t:'x',s:'pe',n:'Strength Elixir'};if(k=='y')return{t:'y',s:'pc',n:'Steel Charm'};
const r=Math.random()+depth*.03,i=r<.6?0:r<.88?1:r<.98?2:3,b=[[1,2],[2,3],[3,5],[5,7]][i],v=rnd(b[0],b[1]);
return{t:'q',k:k,s:'gear',b:k=='a'?Math.max(1,v*2/3|0):v,n:['Common','Fine','Rare','Epic'][i]+(k=='w'?' Blade':' Armor')}}
function gen(){const R0=Math.random;if(daily){let a=dayN*131+depth*977;Math.random=()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
map=Array(H*W).fill(1);es=[];items=new Map();traps=new Map();exp=new Set();let rs;
do{rs=[];for(let i=0;i<50&&rs.length<8;i++){const w=rnd(5,9),h=rnd(4,6),x=rnd(1,W-w-2),y=rnd(1,H-h-2);
if(rs.some(r=>x<r.x+r.w+1&&x+w+1>r.x&&y<r.y+r.h+1&&y+h+1>r.y))continue;rs.push({x,y,w,h})}}while(rs.length<4);
rs.sort((a,b)=>a.x-b.x);
rs.forEach(r=>{for(let j=r.y;j<r.y+r.h;j++)for(let i=r.x;i<r.x+r.w;i++)map[ix(i,j)]=0;r.cx=r.x+(r.w>>1);r.cy=r.y+(r.h>>1)});
for(let i=0;i<rs.length-1;i++){const a=rs[i],b=rs[i+1];for(let x=Math.min(a.cx,b.cx);x<=Math.max(a.cx,b.cx);x++)map[ix(x,a.cy)]=0;
for(let y=Math.min(a.cy,b.cy);y<=Math.max(a.cy,b.cy);y++)map[ix(b.cx,y)]=0}
p.x=p.dx=rs[0].cx;p.y=p.dy=rs[0].cy;const L=rs[rs.length-1];st=null;
if(depth==MAXD)es.push(mk(BOSS,L.cx,L.cy));else st=[L.cx,L.cy];
const free=r=>{for(let i=0;i<30;i++){const x=rnd(r.x,r.x+r.w-1),y=rnd(r.y,r.y+r.h-1);if(!occ(x,y)&&!items.has(ix(x,y))&&!(st&&st[0]==x&&st[1]==y))return[x,y]}};
const pool=EN.filter(e=>e.md<=depth);
rs.slice(1).forEach(r=>{if(!(depth==MAXD&&r==L)){for(let n=pk([0,1,1,1,2,2]);n>0;n--){let u=Math.random()*pool.reduce((s,e)=>s+e.w,0),t=pool.find(e=>(u-=e.w)<0)||pool[0];
for(let k=rnd(t.pk[0],t.pk[1]);k>0;k--){const f=free(r);if(f)es.push(mk(t,f[0],f[1]))}}}
for(let n=pk([0,0,1,1,1,2]);n>0;n--){const f=free(r);if(f)items.set(ix(f[0],f[1]),mkItem())}});
for(let n=2+(depth>>1);n>0;n--){const f=free(pk(rs.slice(1)));if(f)traps.set(ix(f[0],f[1]),0)}
if(depth<MAXD){const f=free(rs[1+rnd(0,rs.length-3)]);if(f)items.set(ix(f[0],f[1]),{t:'shop',s:'shop'})}
Math.random=R0;fov()}
/* ---------- combat ---------- */
function hurt(e,d,c){if(inSk)d=Math.round(d*p.sm);snd(180,.1,'sawtooth');e.hp-=d;e.fl=8;pop(e.x,e.y,'-'+d,c||'#fff');if(e.hp<=0&&es.includes(e))kill(e)}
function hurtP(d){snd(110,.2,'sawtooth',.07);shk=Math.max(shk,d>10?12:6);p.hp-=d;p.fl=8;pop(p.x,p.y,'-'+d,'#f66')}
function kill(e){snd(320,.15);shk=Math.max(shk,e.boss?16:3);const g=e.xp/3|0;kills++;gold+=g;p.xp+=e.xp;say(`You defeated ${e.n}! +${e.xp} XP, +${g} gold.`,'#5c5');es.splice(es.indexOf(e),1);while(p.xp>=p.xn)lvl();if(e.boss)won=true}
function lvl(){const g=CL[p.cls].g;p.lv++;p.xp-=p.xn;p.xn=p.xn*1.5|0;p.mh+=g[0];p.mm+=g[1];p.a+=g[2];p.d+=g[3];p.hp=p.mh;p.mp=p.mm;p.pp++;snd(520,.35,'triangle',.07);
say(`LEVEL UP! You are level ${p.lv}.`,'#fc3');if(p.lv==3)say(`New skill unlocked: ${SK[p.cls][1].n} (key 2)!`,'#fc3')}
const nt=r=>es.filter(e=>dist(e,p)<=r&&los(p.x,p.y,e.x,e.y)).sort((a,b)=>dist(a,p)-dist(b,p))[0];
function atk(e){const c=CL[p.cls];p.mp=Math.min(p.mm,p.mp+c.mh+(p.mx||0));
if(p.cls=='Mage'){const d=Math.max(1,(ta()*1.5|0)-e.d+rnd(-1,1));say(`Arcane Bolt hits ${e.n} for ${d}.`,'#6cf');hurt(e,d,'#6cf');return}
let d=Math.max(1,ta()-e.d+rnd(-1,1));if(Math.random()<c.cr){d*=2;say(`CRITICAL! You hit ${e.n} for ${d}!`,'#fc3')}else say(`You hit ${e.n} for ${d}.`);hurt(e,d)}
const SK={Warrior:[{n:'Shield Slam',c:4,cd:0,lv:1,f(){const t=nt(1);if(!t)return;t.st=2;const d=Math.max(1,ta()*2-t.d);say(`Shield Slam! ${t.n} takes ${d} and is stunned!`,'#6f6');hurt(t,d);return 1}},
{n:'Whirlwind',c:7,cd:3,lv:3,f(){const h=es.filter(e=>Math.max(Math.abs(e.x-p.x),Math.abs(e.y-p.y))<=1);if(!h.length)return;say(`Whirlwind hits ${h.length}!`,'#6f6');h.forEach(e=>hurt(e,Math.max(1,(ta()*1.3|0)-e.d)));return 1}}],
Mage:[{n:'Fireball',c:8,cd:0,lv:1,f(){const t=nt(5);if(!t)return;const d=Math.max(1,ta()*3-(t.d>>1)),sp=es.filter(e=>e!==t&&dist(e,t)<=1);say(`Fireball engulfs ${t.n} for ${d}!`,'#6f6');if(t.rs!='fire')t.bn=3;hurt(t,d,'#f93');sp.forEach(e=>{if(e.rs!='fire')e.bn=2;hurt(e,d>>1,'#f93')});return 1}},
{n:'Frost Nova',c:10,cd:4,lv:3,f(){const h=es.filter(e=>dist(e,p)<=3&&los(p.x,p.y,e.x,e.y));if(!h.length)return;say(`Frost Nova freezes ${h.length}!`,'#6f6');h.forEach(e=>{e.st=2;let x=Math.max(1,ta()-(e.d>>1));if(e.bn>0){x+=4;e.bn=0}hurt(e,x,'#9df')});return 1}}],
Rogue:[{n:'Shadowstrike',c:6,cd:0,lv:1,f(){const t=nt(1);if(!t)return;const h=Math.max(1,(ta()*1.5|0)-t.d);say(`Shadowstrike! Two critical hits for ${h} each!`,'#6f6');hurt(t,h*2,'#fc3');return 1}},
{n:'Poison Blade',c:5,cd:2,lv:3,f(){const t=nt(1);if(!t)return;if(t.rs!='poi')t.poi=5;say(`Poison Blade! ${t.n} is poisoned!`,'#6f6');hurt(t,Math.max(1,ta()-t.d));return 1}}]};
SK.Cleric=[{n:'Smite',c:5,cd:0,lv:1,f(){const t=nt(2);if(!t)return;const d=Math.max(1,ta()*2-t.d);say(`Smite! Holy fire sears ${t.n} for ${d}!`,'#6f6');if(t.rs!='fire')t.bn=3;hurt(t,d,'#fd6');return 1}},
{n:'Mend',c:8,cd:3,lv:3,f(){if(p.hp>=p.mh&&!p.poi)return;const a=Math.max(15,p.mh/4|0);p.hp=Math.min(p.mh,p.hp+a);p.poi=0;pop(p.x,p.y,'+'+a,'#6f6');say(`Mend restores ${a} HP and cures poison.`,'#6f6');return 1}}];
/* ---------- player actions ---------- */

`<div class="bx"><h3>Final build</h3><div class="gr" style="grid-template-columns:repeat(4,1fr)">${T('❤️',r.mh,'Max HP')}${T('🔷',r.mm,'Max MP')}${T('🗡️',r.a,'Attack')}${T('🛡️',r.d,'Defense')}</div>`+
`<span class="ch" style="color:${rc(r.wp)};border-color:${rc(r.wp)}">🗡️ ${esc(r.wp)}</span><span class="ch" style="color:${rc(r.ar)};border-color:${rc(r.ar)}">🛡️ ${esc(r.ar)}</span></div>`+
`<div class="bx"><h3>Perks</h3>${r.pk.length?r.pk.map(x=>`<span class="ch">${esc(x)}</span>`).join(''):'<small>No perks chosen</small>'}</div>`+
`<div class="bx"><h3>Score breakdown</h3>${brk(r.bk,r.sc)}</div>`}
function finish2(w){const B=[['Gold collected',gold],['Depth reached ('+depth+' × 100)',depth*100],['Enemies slain ('+kills+' × 10)',kills*10],['Character level ('+p.lv+' × 25)',p.lv*25]];if(w)B.push(['Victory bonus (Dungeon Lord slain)',1000]);
if(diff!=1){const sub=B.reduce((s,b)=>s+b[1],0);B.push([DMS[diff].n+' mode ('+(diff>1?'+':'−')+'25%)',Math.round(sub*DMS[diff].s)])}
const sc=B.reduce((s,b)=>s+b[1],0);let best=0;try{best=+localStorage.getItem('pyrogue_best')||0;if(sc>best)localStorage.setItem('pyrogue_best',sc)}catch(e){}
const rec={t:Date.now(),cls:p.cls,w:w?1:0,sc,depth,lv:p.lv,kills,gold,turns,mh:p.mh,mm:p.mm,a:ta(),d:td(),wp:wpn?wpn.n+' +'+wpn.b:'none',ar:arm?arm.n+' +'+arm.b:'none',pk:p.pk||[],bk:B,kb:w?'':(p.kb||'unknown causes'),dy:daily?1:0,df:diff,bank:gold+depth*10};
const rl=runs();rl.unshift(rec);try{localStorage.setItem('pyrogue_runs',JSON.stringify(rl.slice(0,40)))}catch(e){}
setTimeout(()=>{$('ovc').dataset.m='';$('ov').style.display='flex';$('ovc').innerHTML=``+det(rec)+(sc>best?'<p style="text-align:center;color:#e8b923"><b>★ New high score! ★</b></p>':`<p><small>Best score: ${best}</small></p>`)+'<button class="c" onclick="menu()">Play again</button><button class="c" onclick="showHist()">Run history</button><button class="c" onclick="location.href=\'../../\'">Back to library</button>'},700)}
function showHist(){$('ovc').dataset.m='';$('ov').style.display='flex';const rl=runs(),best=Math.max(0,...rl.map(r=>r.sc));
$('ovc').innerHTML='<h2>Run history</h2>'+(rl.length?`<p><small>${rl.length} runs · ${rl.filter(r=>r.w).length} wins · best score ${best}</small></p>`+rl.map((r,i)=>`<button class="c" onclick="showRun(${i})"><b>${r.sc}</b> · ${r.cls} · depth ${r.depth} · Lv ${r.lv} · ${r.w?'<span style="color:#4c4">Victory</span>':'died'}<br><small>${new Date(r.t).toLocaleDateString()}${r.dy?' · daily':''}</small></button>`).join(''):'<p>No runs recorded yet. Finish a run and it will show up here (runs from before this update weren’t saved).</p>')+'<button class="c" onclick="menu()">Back</button>'}
function showRun(i){const r=runs()[i];if(!r)return showHist();$('ovc').innerHTML='<h2>Run details</h2>'+det(r)+'<button class="c" onclick="showHist()">Back to history</button>'}
/* ---------- shop, perks, meta ---------- */
function closeOv(){$('ov').style.display='none'}
function quitAsk(){save();$('ovc').dataset.m='';$('ovc').dataset.q=1;$('ov').style.display='flex';
$('ovc').innerHTML='<h2>Leave the game?</h2><p>Your run is saved after every turn, so you can continue it from the main menu next time.</p><button class="c" onclick="location.href=\'../../\'">Back to library</button><button class="c" onclick="quitKeep()">Keep playing</button>'}
function quitKeep(){$('ovc').dataset.q='';closeOv()}
function openShop(){$('ovc').dataset.m='';const o=[['Healing Potion',30,()=>inv.h++],['Mana Potion',20,()=>inv.m++],['+1 ATK',80,()=>p.a++],['+1 DFN',80,()=>p.d++]];window.SH=o;
$('ov').style.display='flex';$('ovc').innerHTML=`<h2>Merchant</h2><p>Gold: ${gold}</p>`+o.map((x,i)=>`<button class="c" ${gold<x[1]?'disabled':''} onclick="buy(${i})">${x[0]} — ${x[1]}g</button>`).join('')+'<button class="c" onclick="closeOv()">Leave</button>'}
function buy(i){const x=window.SH[i];if(gold<x[1])return;gold-=x[1];x[2]();snd(600,.1,'triangle');hud();openShop()}
const PERKS=[['Vitality: +15 max HP',()=>{p.mh+=15;p.hp+=15}],['Power: +2 ATK',()=>p.a+=2],['Armor: +1 DFN',()=>p.d++],['Focus: +6 max MP, +1 MP per hit',()=>{p.mm+=6;p.mp+=6;p.mx=(p.mx||0)+1}],['Skillful: skills deal +25% damage',()=>p.sm+=.25]];
function perk(){if(!p.pp||over)return;const o=PERKS.slice().sort(()=>Math.random()-.5).slice(0,2);$('ovc').dataset.m='';$('ov').style.display='flex';
$('ovc').innerHTML=`<h2>Level ${p.lv}! Choose a perk</h2>`+o.map(x=>`<button class="c" onclick="pickPerk(${PERKS.indexOf(x)})">${x[0]}</button>`).join('')}
function pickPerk(i){PERKS[i][1]();(p.pk=p.pk||[]).push(PERKS[i][0].split(':')[0]);p.pp--;closeOv();say('Perk: '+PERKS[i][0].split(':')[0]+'!','#fc3');hud();perk()}
function meta(){try{return{b:0,h:0,p:0,a:0,...JSON.parse(localStorage.getItem('pyrogue_meta')||'{}')}}catch(e){return{b:0,h:0,p:0,a:0}}}
function saveMeta(M){try{localStorage.setItem('pyrogue_meta',JSON.stringify(M))}catch(e){}}
function upg(){const M=meta(),U=[['h','Hardy: +10 starting HP',100],['p','Packed lunch: start with a healing potion',150],['a','Whetstone: +1 starting ATK',250]];
return`<hr><p><b>Bank: ${M.b} gold</b> <small>(every run adds to it)</small></p>`+U.map(u=>{const c=u[2]*(M[u[0]]+1);return`<button class="c" ${M.b<c||M[u[0]]>=5?'disabled':''} onclick="up('${u[0]}',${c})">${u[1]} (${M[u[0]]}/5) — ${c}g</button>`}).join('')}
function up(k,c){const M=meta();if(M.b<c)return;M.b-=c;M[k]++;saveMeta(M);menu()}
/* ---------- start / menu ---------- */
function start(cls){const c=CL[cls];p={cls,x:0,y:0,dx:0,dy:0,hp:c.hp,mh:c.hp,mp:c.mp,mm:c.mp,a:c.a,d:c.d,ga:0,gd:0,lv:1,xp:0,xn:100,poi:0,fl:0,cdn:[0,0],pp:0,sm:1};
depth=1;gold=kills=turns=0;won=over=false;inv={h:0,m:0};wpn=arm=null;logs=[];txts=[];const M=meta();p.mh+=10*M.h;p.hp=p.mh;inv.h=M.p;p.a+=M.a;gen();say(`You enter the dungeon as a ${cls}. Walk into enemies to attack!`,'#9cf');
$('ov').style.display='none';$('ovc').dataset.m='';hud()}
function menu(){p=null;$('ov').style.display='flex';$('ovc').dataset.m=1;$('ovc').innerHTML='<h1>Seven Floors Down</h1><p>Descend '+MAXD+' floors and slay the Dungeon Lord. Turn-based: enemies move after you do.</p>'+(hasSave()?'<button class="c" onclick="load()"><b>▶ Continue your run</b></button>':'')+
Object.entries(CL).map(([n,c],i)=>`<button class="c" onclick="start('${n}')"><b>${i+1}. ${n}</b> · HP ${c.hp} · MP ${c.mp} · ATK ${c.a} · DFN ${c.d}<br><small>${c.t}</small></button>`).join('')+`<button class="c" onclick="daily=!daily;menu()">Daily dungeon (same maps for everyone today): <b>${daily?'ON':'OFF'}</b></button>`+`<button class="c" onclick="diff=(diff+1)%3;menu()">Difficulty: <b>${DMS[diff].n}</b> — tap to change</button>`+`<button class="c" onclick="showHist()">Run history · ${runs().length} saved</button>`+`<button class="c" onclick="howTo()">How to play</button>`+upg()+'<button class="c" onclick="location.href=\'../../\'">Back to library</button>'}
menu();draw();
</script></body></html>
