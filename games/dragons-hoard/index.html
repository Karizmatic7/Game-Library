<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dragon’s Hoard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;--bg:#ece8f6;--fg:#1d1a30;--mu:#5d5878;--pn:#fff;--ed:#b9b1d6;--ac:#f2b705;--on:#1d1a30}
@media (prefers-color-scheme:dark){:root{--bg:#16142a;--fg:#ece8ff;--mu:#a49fc4;--pn:#232042;--ed:#3f3a68;--ac:#ffcc33;--on:#1d1a30}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:16px 14px 56px}
header{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:14px}
h1{font:700 clamp(24px,5vw,38px)/1.1 Silkscreen,"Courier New",monospace;margin:0}
h2{font-size:18px;margin:0 0 8px}.right h2{margin-top:22px}
.back,.mu{color:var(--mu)}
.cols{display:grid;gap:22px;grid-template-columns:1fr}
@media(min-width:780px){.cols{grid-template-columns:minmax(280px,360px) 1fr}.left{position:sticky;top:12px;align-self:start}}
.gold b{display:block;font:700 clamp(30px,8vw,44px)/1.1 Silkscreen,"Courier New",monospace}
.gold span{color:var(--mu)}
.stage{position:relative;display:flex;justify-content:center;padding:14px 0;min-height:250px}
#pounce{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
#pounce canvas{width:min(70vw,230px);height:auto;aspect-ratio:16/18;image-rendering:pixelated;display:block}
#pounce:active canvas{transform:scale(.94)}
#fx{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.pop{position:absolute;font:700 18px Silkscreen,monospace;color:var(--ac);text-shadow:1px 1px 0 rgba(0,0,0,.55);animation:rise .9s ease-out forwards}
@keyframes rise{to{transform:translateY(-70px);opacity:0}}
@keyframes bob{to{transform:translateY(-6px)}}
.msg{min-height:3em;color:var(--fg)}
button{font:inherit;color:var(--fg);background:var(--pn);border:2px solid var(--ed);border-radius:4px;padding:8px 12px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.buy,.adv{background:var(--ac);color:var(--on);font-weight:700;border:0;box-shadow:2px 2px 0 rgba(0,0,0,.4)}
.buy:disabled{background:var(--ed);color:var(--mu);box-shadow:none;opacity:1}
.adv{position:absolute;z-index:2;animation:bob .8s ease-in-out infinite alternate}
.box{background:var(--pn);border:2px solid var(--ed);border-radius:4px;padding:12px;margin-top:14px;box-shadow:4px 4px 0 var(--ed)}
.box p{margin:0 0 10px;font-size:14px;color:var(--mu)}
.box button+button{margin-left:6px}
.modes{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.modes button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.gen{display:flex;align-items:center;gap:12px;background:var(--pn);border:2px solid var(--ed);border-radius:4px;box-shadow:4px 4px 0 var(--ed);padding:10px;margin:14px 0}
.gen[hidden]{display:none}
.gen canvas{flex:none;width:44px;height:44px;image-rendering:pixelated;border-radius:2px}
.gi{flex:1;min-width:0}.gi b{display:block}.gi small{color:var(--mu)}
.up{display:block;width:100%;text-align:left;margin:8px 0}
.up span{display:block;font-size:14px;color:var(--mu)}
.up small{color:var(--fg);font-weight:700}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>
<div class="wrap">
<header><a class="back" href="../../">All games</a><h1>Dragon’s Hoard</h1></header>
<div class="cols">
<section class="left">
  <div class="gold"><b id="gold">0</b><span id="gps"></span></div>
  <div class="stage" id="stage"><button id="pounce" aria-label="Pounce on the hoard"><canvas id="dragon" width="16" height="18"></canvas></button><div id="fx"></div></div>
  <div class="msg" id="msg" aria-live="polite"></div>
  <p class="mu">Click the dragon to pounce on your hoard. Spend gold on minions that earn for you, then slumber to gain permanent bonuses.</p>
  <div class="box"><h2>Dragon scales</h2><p id="ptxt"></p><button class="buy" id="slumber"></button></div>
  <div class="box"><h2>Stats and saving</h2><p id="stats"></p><button id="exp">Export save</button><button id="imp">Import save</button><button id="rst">Reset</button><p style="margin:10px 0 0">The game saves automatically in this browser.</p></div>
</section>
<section class="right">
  <div class="modes" role="group" aria-label="Buy amount"><b>Minions</b><button data-m="1" aria-pressed="true">Buy 1</button><button data-m="10" aria-pressed="false">Buy 10</button><button data-m="max" aria-pressed="false">Buy max</button></div>
  <div id="gens"></div>
  <h2>Upgrades</h2><div id="ups"></div>
</section>
</div></div>
<script>
const $=s=>document.querySelector(s),rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const SUF=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];
function f(n){if(n<1000)return n<100?String(+n.toFixed(1)):String(Math.floor(n));if(n>=1e36)return n.toExponential(2).replace('+','');const e=Math.floor(Math.log10(n)/3);return(n/Math.pow(1000,e)).toFixed(2)+SUF[e]}

/* ---------- game data ---------- */
const KEY='dh_save',R=1.15;
const GEN=[['Kobold miners',15,.1],['Goblin raiders',100,1],['Mimic chests',1100,8],['Cursed mines',12000,47],['Wyvern nests',130000,260],['Lich vaults',1.4e6,1400],['Void hoards',2e7,7800]].map(([n,c,p],i)=>({n,c,p,i}));
const UPG=[
 {id:'c1',n:'Sharper claws',d:'Pounces are twice as strong.',cost:100,t:'click',v:2},
 {id:'c2',n:'Iron talons',d:'Pounces are twice as strong.',cost:5e3,t:'click',v:2,r:()=>S.life>=1e3},
 {id:'c3',n:'Adamant talons',d:'Pounces are three times as strong.',cost:2.5e5,t:'click',v:3,r:()=>S.life>=5e4},
 {id:'p1',n:'Greedy gaze',d:'Each pounce also earns 1% of your gold per second.',cost:1e4,t:'pct',v:.01,r:()=>S.life>=3e3},
 {id:'p2',n:'Hoard sense',d:'Each pounce earns another 4% of your gold per second.',cost:1e6,t:'pct',v:.04,r:()=>S.life>=3e5},
 {id:'g1',n:'Gilded scales',d:'All gold earned is 25% higher.',cost:5e4,t:'all',v:1.25,r:()=>S.life>=1e4},
 {id:'g2',n:'Treasure sense',d:'All gold earned is 50% higher.',cost:5e6,t:'all',v:1.5,r:()=>S.life>=1e6},
 {id:'g3',n:'Dragonfire',d:'All gold earned is doubled.',cost:5e8,t:'all',v:2,r:()=>S.life>=1e8},
 ...GEN.flatMap(g=>[
  {id:'a'+g.i,n:g.n+': training',d:g.n+' earn twice as much.',cost:g.c*10,t:'gen',i:g.i,v:2,r:()=>S.own[g.i]>=1},
  {id:'b'+g.i,n:g.n+': mastery',d:g.n+' earn twice as much.',cost:g.c*1000,t:'gen',i:g.i,v:2,r:()=>S.own[g.i]>=25}])
];

/* ---------- state and saving ---------- */
const fresh=()=>({gold:0,life:0,all:0,own:GEN.map(()=>0),up:{},sc:0,clicks:0,runs:0,t:Date.now(),born:Date.now()});
function fix(s){const d={...fresh(),...s};while(d.own.length<GEN.length)d.own.push(0);return d}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s)return fix(s)}catch(e){}return fresh()}
let S=load(),mode='1',fr=0,upSig='',pl=-1,mt=0;
function save(){S.t=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- maths ---------- */
const ms=n=>[10,25,50,100,200].reduce((m,t)=>n>=t?m*2:m,1);
const upv=(t,i)=>UPG.filter(u=>S.up[u.id]&&u.t==t&&(t!='gen'||u.i==i)).reduce((m,u)=>m*u.v,1);
const genps=i=>GEN[i].p*S.own[i]*ms(S.own[i])*upv('gen',i);
const glob=()=>(1+.1*S.sc)*upv('all')*(Date.now()<fr?7:1);
const gps=()=>GEN.reduce((s,g)=>s+genps(g.i),0)*glob();
const cpow=()=>upv('click')*(1+.1*S.sc)*(Date.now()<fr?7:1)+gps()*UPG.filter(u=>S.up[u.id]&&u.t=='pct').reduce((s,u)=>s+u.v,0);
const cost=(i,n)=>GEN[i].c*Math.pow(R,S.own[i])*(Math.pow(R,n)-1)/(R-1);
function qty(i){if(mode!=='max')return+mode;let n=Math.floor(Math.log(S.gold*(R-1)/(GEN[i].c*Math.pow(R,S.own[i]))+1)/Math.log(R));while(n>0&&cost(i,n)>S.gold)n--;return Math.max(1,n)}
const earn=g=>{S.gold+=g;S.life+=g;S.all+=g};
const scales=()=>Math.floor(Math.sqrt(S.all/1e6))-S.sc;

/* ---------- pixel art ---------- */
const DRAGON=["h..............h","hh............hh",".hh..rrrrrr..hh.","..hrrrrrrrrrrh..","..rrrrrrrrrrrr..",".rrryyrrrryyrrr.",".rrrykrrrrkyrrr.",".rrrrrrrrrrrrrr.","..rrrrrrrrrrrr..","..rrrdrrrrdrrr..","..rrrrrrrrrrrr..","...rrwrrrrwrr...","....rrrrrrrr....",".....rrrrrr....."];
const PAL={r:'#c0392b',h:'#f0e6c8',y:'#ffcc33',k:'#111',d:'#7a1f16',w:'#fff'};
function drawDragon(L){const x=$('#dragon').getContext('2d');x.clearRect(0,0,16,18);
 DRAGON.forEach((row,y)=>[...row].forEach((c,i)=>{if(PAL[c]){x.fillStyle=PAL[c];x.fillRect(i,y,1,1)}}));
 for(let r=0;r<4;r++){const w=Math.min(16,Math.max(0,L*2-r*3)),s=Math.floor((16-w)/2),y=17-r;for(let i=0;i<w;i++){x.fillStyle=(i+y)%3==0?'#e9a817':'#ffcc33';x.fillRect(s+i,y,1,1)}}}
function thumb(cv,seed,bg){const x=cv.getContext('2d');let s=0;for(const ch of seed)s=(s*31+ch.charCodeAt(0))>>>0;
 const rn=()=>(s=(s*1664525+1013904223)>>>0)/4294967296;x.fillStyle=bg;x.fillRect(0,0,8,8);x.fillStyle='#ffcc33';
 for(let y=0;y<8;y++)for(let i=0;i<4;i++)if(rn()>.45){x.fillRect(i,y,1,1);x.fillRect(7-i,y,1,1)}}
const BG=['#3b1d5c','#1d4d3b','#5c3b1d','#1d3b5c','#5c1d3b','#2f2f6b','#6b1d1d'];

/* ---------- interface ---------- */
$('#gens').innerHTML=GEN.map(g=>`<div class="gen" id="r${g.i}" hidden><canvas width="8" height="8" id="s${g.i}" aria-hidden="true"></canvas><div class="gi"><b>${g.n}</b><small id="o${g.i}"></small></div><button class="buy" data-b="${g.i}" id="c${g.i}"></button></div>`).join('');
GEN.forEach(g=>thumb($('#s'+g.i),g.n,BG[g.i]));

function msg(t){$('#msg').textContent=t;clearTimeout(mt);mt=setTimeout(()=>{$('#msg').textContent=''},8000)}
function floatText(txt,e){const s=$('#stage').getBoundingClientRect(),el=document.createElement('span');el.className='pop';el.textContent=txt;
 let x=s.width/2,y=s.height/2;if(e&&e.detail>0){x=e.clientX-s.left;y=e.clientY-s.top}el.style.left=(x-20)+'px';el.style.top=(y-20)+'px';$('#fx').append(el);setTimeout(()=>el.remove(),900)}

function ups(){const v=UPG.filter(u=>!S.up[u.id]&&(!u.r||u.r())).sort((a,b)=>a.cost-b.cost).slice(0,8),sig=v.map(u=>u.id).join();
 if(sig!==upSig){upSig=sig;$('#ups').innerHTML=v.length?v.map(u=>`<button class="up" data-u="${u.id}"><b>${u.n}</b><span>${u.d}</span><small>Cost ${f(u.cost)}</small></button>`).join(''):'<p class="mu">New upgrades appear as your hoard grows.</p>'}
 document.querySelectorAll('[data-u]').forEach(b=>{b.disabled=S.gold<UPG.find(u=>u.id==b.dataset.u).cost})}

function render(){
 $('#gold').textContent=f(Math.floor(S.gold));
 $('#gps').textContent=f(gps())+' gold per second'+(Date.now()<fr?' (frenzy: times 7)':'');
 GEN.forEach(g=>{const i=g.i,row=$('#r'+i),show=i==0||S.own[i]>0||S.gold>=g.c*.5||S.own[i-1]>0;row.hidden=!show;if(!show)return;
  const n=qty(i),c=cost(i,n);$('#o'+i).textContent=S.own[i]+' owned, '+f(genps(i)*glob())+' gold per second';
  $('#c'+i).textContent='Buy '+n+' for '+f(c);$('#c'+i).disabled=S.gold<c});
 ups();
 const gain=scales();
 $('#ptxt').textContent='You have '+S.sc+' dragon scales, adding '+(S.sc*10)+'% to all gold. Slumbering resets your gold, minions and upgrades, but you keep your scales.';
 $('#slumber').textContent=gain>=1?'Slumber for '+gain+' scale'+(gain>1?'s':''):'Reach '+f(Math.pow(S.sc+1,2)*1e6)+' total gold for another scale';
 $('#slumber').disabled=gain<1;
 const m=Math.floor((Date.now()-S.born)/60000);
 $('#stats').textContent='Lifetime gold '+f(S.all)+', pounces '+S.clicks+', slumbers '+S.runs+', time played '+Math.floor(m/60)+'h '+(m%60)+'m.';
 const L=Math.min(9,Math.floor(Math.log10(S.gold+1)));if(L!==pl){pl=L;drawDragon(L)}}

/* ---------- actions ---------- */
function pounce(e){const v=cpow();earn(v);S.clicks++;floatText('+'+f(v),e);render()}
function buyGen(i){const n=qty(i),c=cost(i,n);if(S.gold<c)return;S.gold-=c;S.own[i]+=n;render()}
function buyUp(id){const u=UPG.find(x=>x.id==id);if(!u||S.up[id]||S.gold<u.cost)return;S.gold-=u.cost;S.up[id]=1;render()}
function slumber(){const gain=scales();if(gain<1)return;
 if(!confirm('Slumber and gain '+gain+' dragon scale'+(gain>1?'s':'')+'? Your gold, minions and upgrades will reset.'))return;
 S.sc+=gain;S.runs++;S.gold=0;S.life=0;S.own=GEN.map(()=>0);S.up={};upSig='';pl=-1;msg('You wake with '+gain+' more dragon scale'+(gain>1?'s':'')+'.');save();render()}

$('#pounce').addEventListener('click',pounce);
$('#slumber').addEventListener('click',slumber);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.b!==undefined)buyGen(+b.dataset.b);
 else if(b.dataset.u)buyUp(b.dataset.u);
 else if(b.dataset.m){mode=b.dataset.m;document.querySelectorAll('[data-m]').forEach(x=>x.setAttribute('aria-pressed',x===b));render()}});
$('#exp').onclick=()=>{save();prompt('Copy this save code to keep it safe:',btoa(JSON.stringify(S)))};
$('#imp').onclick=()=>{const c=prompt('Paste a save code:');if(!c)return;try{S=fix(JSON.parse(atob(c.trim())));upSig='';pl=-1;save();render();msg('Save loaded.')}catch(e){msg('That save code did not work.')}};
$('#rst').onclick=()=>{if(confirm('Erase all progress, including dragon scales? This cannot be undone.')){S=fresh();upSig='';pl=-1;save();render()}};

/* ---------- wandering adventurer: click for a bonus ---------- */
function schedule(){setTimeout(spawn,rnd(50,110)*1000)}
function spawn(){if(document.hidden){schedule();return}
 const b=document.createElement('button');b.className='adv';b.textContent='Ambush the adventurer!';b.style.left=rnd(2,40)+'%';b.style.top=rnd(4,70)+'%';
 b.onclick=()=>{b.remove();if(Math.random()<.5){const g=Math.max(gps()*90,25+cpow()*15);earn(g);msg('You ambush the adventurer and take '+f(g)+' gold.')}
  else{fr=Date.now()+20000;msg('Frenzy! Everything earns 7 times as much for 20 seconds.')}};
 $('#stage').append(b);setTimeout(()=>b.remove(),14000);schedule()}

/* ---------- start ---------- */
const away=Math.min(21600,(Date.now()-S.t)/1000);
if(away>60&&gps()>0){const g=gps()*away;earn(g);msg('Welcome back! Your minions earned '+f(g)+' gold while you were away.')}
let last=Date.now();
setInterval(()=>{const n=Date.now(),dt=Math.min(21600,(n-last)/1000);last=n;earn(gps()*dt);render()},100);
setInterval(save,10000);
addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
setTimeout(spawn,30000);
render();
</script>
</body></html>
